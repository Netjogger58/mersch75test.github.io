<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mersch75 Statistik Dashboard</title>
  <desc id="desc">Witzeg illustréiert Statistik-Dashboard mat Handball, Diagrammer, Tabellen an Mersch75-Faarwen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="0.48" stop-color="#d8e8ff"/>
      <stop offset="1" stop-color="#fff4b8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#003f86"/>
      <stop offset="1" stop-color="#002f65"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#002f65" flood-opacity="0.22"/>
    </filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#003f86" stroke-opacity="0.08" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1305" cy="170" r="210" fill="#ffd500" opacity="0.28"/>
  <circle cx="260" cy="725" r="180" fill="#003f86" opacity="0.1"/>
  <g transform="translate(915 110) rotate(8)" filter="url(#shadow)">
    <rect x="0" y="0" width="530" height="610" rx="42" fill="white" opacity="0.92"/>
    <rect x="36" y="42" width="458" height="72" rx="24" fill="url(#blue)"/>
    <text x="64" y="90" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#ffd500">LIVE STATISTIK</text>
    <g transform="translate(62 170)">
      <rect x="0" y="250" width="58" height="120" rx="16" fill="#003f86"/>
      <rect x="88" y="180" width="58" height="190" rx="16" fill="#ffd500"/>
      <rect x="176" y="95" width="58" height="275" rx="16" fill="#003f86"/>
      <rect x="264" y="35" width="58" height="335" rx="16" fill="#ffd500"/>
      <rect x="352" y="140" width="58" height="230" rx="16" fill="#003f86"/>
      <path d="M0 370H430" stroke="#002f65" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
      <path d="M29 250 C120 150 185 190 293 35 C345 74 385 102 410 140" fill="none" stroke="#ff6b35" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="293" cy="35" r="18" fill="#ff6b35"/>
    </g>
  </g>
  <g transform="translate(120 135)" filter="url(#shadow)">
    <rect x="0" y="0" width="650" height="560" rx="46" fill="#002f65" opacity="0.9"/>
    <text x="56" y="86" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#ffd500">MERSCH75 ANALYSE-LABO</text>
    <text x="56" y="150" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#fff">Wien huet déi meeschte Goals?</text>
    <text x="56" y="196" font-family="Arial, sans-serif" font-size="27" fill="#fff" opacity="0.9">D'Excel-Tabelle schwëtzt. De Ball laacht.</text>
    <g transform="translate(60 250)">
      <rect x="0" y="0" width="118" height="92" rx="24" fill="#fff" opacity="0.96"/>
      <text x="59" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#002f65">42</text>
      <text x="59" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#002f65">GOALS</text>
      <rect x="146" y="0" width="118" height="92" rx="24" fill="#ffd500"/>
      <text x="205" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#002f65">17</text>
      <text x="205" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#002f65">ASSISTS</text>
      <rect x="292" y="0" width="118" height="92" rx="24" fill="#fff" opacity="0.96"/>
      <text x="351" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#002f65">99%</text>
      <text x="351" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#002f65">TEAM</text>
    </g>
    <g transform="translate(70 410)">
      <path d="M0 56 C92 -30 158 112 252 36 S430 0 510 70" fill="none" stroke="#ffd500" stroke-width="16" stroke-linecap="round"/>
      <circle cx="0" cy="56" r="17" fill="#fff"/>
      <circle cx="252" cy="36" r="17" fill="#fff"/>
      <circle cx="510" cy="70" r="17" fill="#fff"/>
    </g>
  </g>
  <g transform="translate(1040 635)">
    <circle cx="140" cy="90" r="92" fill="#fff" filter="url(#shadow)"/>
    <circle cx="140" cy="90" r="75" fill="#ffd500"/>
    <path d="M140 28 L184 60 L167 112 L113 112 L96 60 Z" fill="#003f86" opacity="0.95"/>
    <path d="M96 60 L54 82 M184 60 L226 82 M113 112 L90 160 M167 112 L190 160" stroke="#003f86" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <circle cx="140" cy="90" r="76" fill="none" stroke="#003f86" stroke-width="8"/>
    <text x="140" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#002f65">Ball seet: +3!</text>
  </g>
  <g transform="translate(780 710) rotate(-5)">
    <rect x="0" y="0" width="320" height="92" rx="30" fill="#fff" opacity="0.95" filter="url(#shadow)"/>
    <text x="34" y="38" font-family="Arial, sans-serif" font-size="25" font-weight="900" fill="#002f65">Expected Goals?</text>
    <text x="34" y="70" font-family="Arial, sans-serif" font-size="21" font-weight="800" fill="#ff6b35">Mir nennen et: Bauchgefill.</text>
  </g>
  <g opacity="0.18" fill="#002f65">
    <text x="1290" y="815" font-family="Arial, sans-serif" font-size="96" font-weight="900">75</text>
    <text x="55" y="830" font-family="Arial, sans-serif" font-size="54" font-weight="900">#ZesummeStaark</text>
  </g>
</svg>
